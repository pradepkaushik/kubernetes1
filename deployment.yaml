apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes1-deployment
  labels:
    app: kubernetes1-label
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kubernetes1-label
  template:
    metadata:
      labels:
        app: kubernetes1-label
    spec:
      containers:
      - name: kubernetes1-container
        image: drblaxk/toothiii-website:latest
        ports:
        - containerPort: 80
